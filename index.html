<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>지하철 눈치 생존</title>
<style>
:root{--bg:#eef0f3;--fg:#1c1e21;--bar:#c9ced4;--panel:rgba(255,255,255,.96);--me:#2f6fed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--fg:#eceff3;--bar:#3a3f46;--panel:rgba(26,29,34,.96)}}
:root[data-theme="dark"]{--bg:#15171a;--fg:#eceff3;--bar:#3a3f46;--panel:rgba(26,29,34,.96)}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{height:100dvh;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#hud{width:min(94vw,440px);padding:8px 0 4px}
#top{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;margin-bottom:6px;gap:6px}
#badge{color:#fff;padding:2px 10px;border-radius:12px}
#mu{font-size:16px;padding:0 6px;border:0;background:transparent}
#bar{position:relative;height:20px;background:var(--bar);border-radius:10px;overflow:hidden}
#fill{height:100%;width:0}
#pct{position:absolute;inset:0;text-align:center;font-size:12px;line-height:20px;font-weight:700;color:#1b1d22}
#info{display:flex;justify-content:space-between;margin-top:5px;font-size:13px;font-weight:700}
#msg{margin-top:5px;min-height:34px;padding:6px 8px;border-radius:8px;background:var(--bar);font-size:13px;font-weight:600;text-align:center;box-sizing:border-box}
#wrap{position:relative;flex:1;min-height:0;width:min(94vw,440px);display:flex;justify-content:center;align-items:center;padding:6px 0 8px;box-sizing:border-box}
canvas{display:block;border-radius:12px;background:#262a31}
#toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);padding:12px 18px;border-radius:14px;font-size:20px;font-weight:800;color:#fff;opacity:0;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;animation:up 1.3s ease-out}
#toast.ok{background:#1fa14a}#toast.no{background:#d4432f}#toast.vi{background:#7b2cbf}
@keyframes up{from{transform:translate(-50%,-30%)}to{transform:translate(-50%,-70%)}}
#ov{position:absolute;inset:6px 0 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel);border-radius:12px;text-align:center;padding:14px;overflow:auto}
#ov h2{font-size:22px;margin:0 0 8px}
#ov p{margin:6px 0;line-height:1.5;font-size:13px}
.lb{font-size:12px;font-weight:700;margin:8px 0 4px;opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font:inherit;font-size:14px;font-weight:700;padding:7px 12px;border-radius:18px;border:2px solid var(--bar);background:transparent;color:var(--fg)}
.chip.on{background:var(--me);border-color:var(--me);color:#fff}
#go{font:inherit;font-weight:800;padding:12px 34px;border:0;border-radius:12px;background:var(--me);color:#fff;font-size:18px;margin-top:12px}

body,button,input{font-family:'DOSSaemmul',-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#badge,#msg,#bar,.chip,.mb,#toast,#mu,#ov{border-radius:0!important}
#bar,#msg,#mu,.chip,.mb{border:3px solid #1b1d22!important}
#badge{border:3px solid #1b1d22}
#msg{background:#fff8d6;color:#1b1d22}
#mu{background:#ffd23f;color:#1b1d22;font-size:13px;padding:2px 8px;font-weight:700}
#ov{background:#fff8d6;color:#1b1d22;border:4px solid #1b1d22;box-shadow:0 5px 0 #1b1d22}
.logo{font-size:34px;line-height:1.15;font-weight:900;margin:0 0 6px;color:#e8452c;}
.mb{display:block;width:70%;max-width:240px;margin:8px auto 0;padding:11px 0;font-size:18px;font-weight:800;background:#2fbf5a;color:#fff;box-shadow:0 4px 0 #1b1d22;}
.mb.sub{background:#6c7a89}
.mb:active{transform:translateY(3px);box-shadow:0 1px 0 #1b1d22}
.chip{background:#fff;color:#1b1d22;box-shadow:0 3px 0 #1b1d22}
.chip.on{background:#ffd23f}
#ov input[type=range]{width:70%;touch-action:manipulation}
#ov .how{text-align:left;font-size:14px;line-height:1.6;margin:4px 0}

:root{--pf:'DOSSaemmul',-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;--bf:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif}
body{font-family:var(--bf)}
button,input{font-family:inherit}
.logo,#ov h2,.mb,.chip,#badge,#sc,#mu,#toast,.lb{font-family:var(--pf)}
#hud{background:#fff8d6;color:#1b1d22;border:3px solid #1b1d22;box-shadow:0 3px 0 #1b1d22;padding:6px 8px;margin-top:6px;box-sizing:border-box}
#top{font-size:15px}#info{font-size:14px;font-weight:700}
#msg{border:0!important;background:transparent!important;padding:4px 0 0;min-height:40px;font-size:15px;line-height:1.5;font-weight:600;text-align:left}
#bar{background:#d9d2b4}
#badge{padding:2px 10px;font-size:14px}
#ov{justify-content:flex-start!important;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#ov>:first-child{margin-top:auto}#ov>:last-child{margin-bottom:auto}
#ov p{font-size:15px;line-height:1.6}
#ov .how{font-size:15px;line-height:1.75}
.lb{font-size:13px;opacity:1;letter-spacing:.5px}
.chip{font-size:15px;padding:8px 12px;min-height:38px}
.mb{min-height:48px;font-size:19px}
.logo{font-size:clamp(26px,9vw,40px)}
@media (max-height:680px){.logo{font-size:26px}.mb{min-height:42px;font-size:17px}#ov{padding:10px}#msg{min-height:34px;font-size:14px}}
#ov{background:rgba(20,22,31,.55)!important;border:0!important;box-shadow:none!important;padding:10px;align-items:center}
.card{background:#fff8d6;color:#1b1d22;border:4px solid #1b1d22;box-shadow:0 5px 0 #1b1d22;padding:14px;width:100%;max-width:340px;box-sizing:border-box;text-align:center;display:flex;flex-direction:column;align-items:center}
.card .how{width:100%}
.chip.on{color:#1b1d22!important}
#stage{position:relative;flex:none}#stage canvas{position:absolute;left:0;top:0;width:100%;height:100%}#tv{pointer-events:none;background:transparent!important;image-rendering:auto!important}
.chip.sw.on{outline:3px solid #ffd23f;outline-offset:2px}
.rec{width:100%;text-align:left}.rec .lh{font-family:var(--pf);font-size:15px;color:#fff;padding:3px 8px;margin:10px 0 2px;border:2px solid #1b1d22}.rec .rr{display:flex;justify-content:space-between;font-size:14px;padding:4px 6px;border-bottom:1px dashed rgba(27,29,34,.35)}
.cs{display:flex;align-items:center;justify-content:center;gap:10px}
.ar{font-family:var(--pf);font-size:28px;line-height:1;background:#fff;color:#1b1d22;border:3px solid #1b1d22;width:42px;height:60px;box-shadow:0 3px 0 #1b1d22}
#pv{border:3px solid #1b1d22;background:#cfd5dd}
.cn{display:flex;align-items:center;gap:8px;margin:6px 0 0;font-family:var(--pf);font-size:17px}
.chip.sm{min-height:28px;padding:3px 10px;font-size:13px}
p.sm{font-size:13px!important;margin:4px 0!important;line-height:1.5}
body{word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%}
.chip,.mb,#badge,#mu,#sc{white-space:nowrap}
#top{flex-wrap:wrap;row-gap:4px}
.card,#hud,#msg,.how,.rec{min-width:0;overflow-wrap:break-word}
@media (max-width:370px){#top{font-size:13px}.chip{font-size:14px;padding:7px 10px}.logo{font-size:28px}#msg{font-size:14px}.ar{width:36px}}
#cl,#ct{gap:5px}#cl .chip,#ct .chip{padding:7px 10px;min-width:44px;font-size:15px}.lb{margin:6px 0 3px}
