<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>지하철 눈치 생존</title>
<style>
:root{--bg:#eef0f3;--fg:#1c1e21;--bar:#c9ced4;--panel:rgba(255,255,255,.96);--me:#2f6fed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--fg:#eceff3;--bar:#3a3f46;--panel:rgba(26,29,34,.96)}}
:root[data-theme="dark"]{--bg:#15171a;--fg:#eceff3;--bar:#3a3f46;--panel:rgba(26,29,34,.96)}
html,body{height:100%;margin:0;overscroll-behavior:none}body{height:100dvh;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden}
#hud{width:min(94vw,440px);padding:8px 0 4px}
#top{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;margin-bottom:6px}
#badge{color:#fff;padding:2px 10px;border-radius:12px}
#bar{position:relative;height:20px;background:var(--bar);border-radius:10px;overflow:hidden}
#fill{height:100%;width:0}
#pct{position:absolute;inset:0;text-align:center;font-size:12px;line-height:20px;font-weight:700;color:#000;mix-blend-mode:difference;filter:invert(1)}
#info{display:flex;justify-content:space-between;margin-top:5px;font-size:13px;font-weight:700}
#msg{margin-top:5px;min-height:34px;padding:6px 8px;border-radius:8px;background:var(--bar);font-size:13px;font-weight:600;text-align:center;box-sizing:border-box}
#wrap{position:relative;flex:1;min-height:0;width:min(94vw,440px);display:flex;justify-content:center;padding:6px 0 8px}
canvas{height:100%;max-width:100%;aspect-ratio:360/500;border-radius:12px;background:#262a31}
#toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);padding:12px 20px;border-radius:14px;font-size:22px;font-weight:800;color:#fff;opacity:0;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;animation:up 1.2s ease-out}
#toast.ok{background:#1fa14a}#toast.no{background:#d4432f}
@keyframes up{from{transform:translate(-50%,-30%)}to{transform:translate(-50%,-70%)}}
#ov{position:absolute;inset:6px 0 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel);border-radius:12px;text-align:center;padding:14px;overflow:auto}
#ov h2{font-size:22px;margin:0 0 8px}
#ov p{margin:6px 0;line-height:1.5;font-size:13px}
.lb{font-size:12px;font-weight:700;margin:8px 0 4px;opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font:inherit;font-size:14px;font-weight:700;padding:7px 12px;border-radius:18px;border:2px solid var(--bar);background:transparent;color:var(--fg)}
.chip.on{background:var(--me);border-color:var(--me);color:#fff}
#go{font:inherit;font-weight:800;padding:12px 34px;border:0;border-radius:12px;background:var(--me);color:#fff;font-size:18px;margin-top:12px}
</style>
</head>
<body>
<div id="hud"><div id="top"><span id="badge"></span><span id="tinfo"></span><span id="sc"></span></div>
<div id="bar"><div id="fill"></div><span id="pct"></span></div>
<div id="info"><span id="nx"></span><span id="cmf"></span><span id="tm"></span></div><div id="msg"></div></div>
<div id="wrap"><canvas id="cv"></canvas><div id="toast"></div><div id="ov"></div></div>
<script>
const W=360,H=500,S=52,OX=50,OY=16,C=5,R=9,CYC=16,ANN=8,BAG=3,DOOR=4.2;
const LINES={1:{n:'1호선',c:'#0052A4',b:.6,st:['서울역','시청','종각','종로3가','종로5가','동대문','동묘앞','신설동']},
2:{n:'2호선',c:'#00A84D',b:.85,st:['사당','교대','강남','역삼','선릉','삼성','종합운동장','잠실']},
3:{n:'3호선',c:'#EF7C1C',b:.45,st:['양재','교대','고속터미널','잠원','신사','압구정','옥수','금호']},
4:{n:'4호선',c:'#00A5DE',b:.7,st:['사당','동작','이촌','신용산','삼각지','서울역','회현','명동']},
9:{n:'9호선',c:'#B8A46A',b:1,st:['당산','여의도','샛강','노량진','동작','고속터미널','신논현','선정릉']}};
const TIMES={a:['06:00 새벽',.4],b:['08:00 출근',1],c:['14:00 낮',.45],d:['18:00 퇴근',.9],e:['23:00 심야',.35]};
const COLS=['#3b4a6b','#6b3b3b','#2f5d50','#7a6a3a','#4a3b6b','#555','#8a4a5a','#2d6a8a','#6a5a4a','#3a3a3a'];
const HAIR=['#1a1a1a','#3b2a1a','#5a3a20','#aaa','#222'],SKIN=['#f1c9a5','#e0ac82','#c68c62','#f5d6b8'];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),dpr=Math.min(2,devicePixelRatio||1);
cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
const $=id=>document.getElementById(id),ov=$('ov'),tEl=$('toast');
let line=2,time='b',diff=1,npcs=[],ghosts=[],me={x:2,y:4,px:2,py:4,sit:false},stress=0,score=0,combo=0,okN=0,rd=0,phase='idle',t=0,dp=0,pt=0,clock=0,annD=false,bagD=false,door=0,after='',state='idle',last=performance.now(),tt,best=0;
try{best=+localStorage.getItem('subwayBest')||0}catch(e){}
const rnd=a=>a[Math.random()*a.length|0],isSeat=(x,y)=>(x===0||x===C-1)&&y!==4;
const gx=x=>OX+x*S+S/2,gy=y=>OY+y*S+S/2;
const calc=()=>Math.min(1,LINES[line].b*TIMES[time][1]+.1);
const at=(x,y)=>me.x===x&&me.y===y?me:npcs.find(n=>n.x===x&&n.y===y);
function mk(x,y,seated){return{x,y,px:x,py:y,seated,col:rnd(COLS),hair:rnd(HAIR),skin:rnd(SKIN),dir:seated?(x<2?1:-1):(Math.random()<.5?1:-1),role:'stayer',cue:''}}
function setMsg(s){$('msg').textContent=s}
function toast(s,c){tEl.textContent=s;tEl.className='show '+c;clearTimeout(tt);tt=setTimeout(()=>tEl.className='',1250)}
function startRound(keep){diff=calc();ghosts=[];if(!keep){npcs=[];Object.assign(me,{x:2,y:4,px:2,py:4,sit:false})}
 for(let y=0;y<R;y++)for(const x of[0,C-1])if(y!==4&&!at(x,y))npcs.push(mk(x,y,true));npcs.forEach(n=>{n.cue='';n.lv=0;n.tk=0;n.role='stayer'});
 const s=npcs.filter(n=>n.seated).sort(()=>Math.random()-.5),lv=Math.max(2,Math.min(4,Math.round(4-diff*2))),fk=Math.round(2+diff*3);
 s.forEach((n,i)=>n.role=i<lv?'leaver':i<lv+fk?'faker':'stayer');
 let k=Math.round(2+5*diff)-npcs.filter(n=>!n.seated).length,g=0;while(k>0&&g++<200){const x=1+Math.random()*3|0,y=Math.random()*R|0;if(!at(x,y)){npcs.push(mk(x,y,false));k--}}
 phase='run';t=CYC;dp=0;annD=bagD=false;after='';
 const L=LINES[line];setMsg(keep?'문이 닫힙니다. 같은 칸에서 계속 자리를 노리세요!':`${L.st[rd%8]}역 출발! 내릴 사람을 찾아 앞에 서세요.`)}
function showSelect(head){ov.style.display='flex';
 ov.innerHTML=(head||'<h2>🚇 지하철 눈치 생존</h2><p>서 있으면 스트레스가 차오릅니다. 👀 쳐다보고 🎒 가방을 챙기는 사람 앞에서 기다렸다가, 문이 열리면 재빨리 앉으세요. 안 내리는 사람도 있습니다!</p>')+
 '<div class="lb">노선</div><div class="chips" id="cl"></div><div class="lb">시간대</div><div class="chips" id="ct"></div><p id="ds"></p><button id="go">출발</button>';
 const upd=()=>{diff=calc();$('ds').innerHTML=`난이도 ${'★'.repeat(1+Math.round(diff*4))}${'☆'.repeat(4-Math.round(diff*4))} · 최고 ${best}점<br><small>혼잡도는 게임용 설정값입니다</small>`;
  document.querySelectorAll('#cl .chip').forEach(c=>c.classList.toggle('on',c.dataset.k==line));document.querySelectorAll('#ct .chip').forEach(c=>c.classList.toggle('on',c.dataset.k==time))};
 for(const k in LINES){const b=document.createElement('button');b.className='chip';b.dataset.k=k;b.textContent=LINES[k].n;b.onclick=()=>{line=k;upd();startRound();phase='idle'};$('cl').appendChild(b)}
 for(const k in TIMES){const b=document.createElement('button');b.className='chip';b.dataset.k=k;b.textContent=TIMES[k][0];b.onclick=()=>{time=k;upd();startRound();phase='idle'};$('ct').appendChild(b)}
 upd();$('go').onclick=begin}
function begin(){score=0;combo=0;okN=0;stress=0;rd=0;state='play';ov.style.display='none';startRound();last=performance.now()}
function over(){state='end';phase='idle';if(score>best){best=score;try{localStorage.setItem('subwayBest',best)}catch(e){}}
 showSelect(`<h2>게임 오버 😵</h2><p>스트레스가 가득 찼습니다!<br>점수 <b>${score}</b> · 앉기 성공 ${okN}회</p>`)}
function success(){navigator.vibrate&&navigator.vibrate(60);phase='pause';pt=1.4;after='ok';combo++;okN++;
 const sp=Math.max(0,Math.round((3.2-dp)*45)),pts=Math.round((100+sp+combo*20)*(1+diff));score+=pts;stress=Math.max(0,stress-50);
 toast(`💺 앉기 성공! +${pts}`,'ok');setMsg(`속도 보너스 +${sp} · 콤보 ${combo}연속`)}
function fail(){phase='pause';pt=1.2;after='no';combo=0;stress=Math.min(100,stress+8);toast('😩 못 앉았다… 스트레스 +8','no');setMsg('다음 역에서 다시 도전하세요.')}
function move(dx,dy){if(state!=='play'||(phase!=='run'&&phase!=='door'))return;const nx=me.x+dx,ny=me.y+dy;
 if(nx<0||ny<0||nx>=C||ny>=R)return;const o=at(nx,ny);if(o){if(o.seated||me.sit)return;o.x=me.x;o.y=me.y}me.x=nx;me.y=ny;me.sit=isSeat(nx,ny);if(me.sit&&phase==='door')success()}
function leave(n){npcs.splice(npcs.indexOf(n),1);ghosts.push(Object.assign({},n,{tx:n.x<2?-.8:C-.2,ty:4,a:1}));
 const seat={x:n.x,y:n.y};let best=null,bt=99;
 npcs.forEach(s=>{if(s.seated||s.tk)return;const d=Math.abs(s.x-seat.x)+Math.abs(s.y-seat.y);if(d<=5){const rt=(.35+d*.4+Math.random()*.5)*(1.3-.55*diff);if(rt<bt){bt=rt;best=s}}});
 if(best){best.tk=clock+bt;best.tg=seat}}
function comfort(){let n=0;for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){if((dx||dy)&&at(me.x+dx,me.y+dy))n++}let f=.7+.12*n;if(me.y===4)f*=(me.x===2?1.2:1.5);return f}
function update(dt){clock+=dt;
 npcs.forEach(n=>{n.px+=(n.x-n.px)*Math.min(1,dt*9);n.py+=(n.y-n.py)*Math.min(1,dt*9)});
 me.px+=(me.x-me.px)*Math.min(1,dt*14);me.py+=(me.y-me.py)*Math.min(1,dt*14);
 ghosts.forEach(g=>{g.px+=(g.tx-g.px)*Math.min(1,dt*2.2);g.py+=(g.ty-g.py)*Math.min(1,dt*2.2);g.a-=dt*.7});ghosts=ghosts.filter(g=>g.a>0);
 door+=((phase==='door'||after==='ok'?1:0)-door)*Math.min(1,dt*6);
 if(state!=='play')return;
 if(phase==='run'||phase==='door'){if(!me.sit){me.cf=comfort();stress=Math.min(100,stress+(.8+diff)*(.5+.015*stress)*me.cf*dt)}}
 if(stress>=100&&phase!=='pause'){return over()}
 const L=LINES[line],nxt=L.st[(rd+1)%8];
 if(phase==='run'){t-=dt;
  if(t<=ANN&&!annD){annD=true;setMsg(`📢 이번 역은 ${nxt}, ${nxt}역입니다. 내리실 문은 양쪽입니다.`);npcs.forEach(n=>{if(n.seated&&n.role!=='stayer')n.cue='👀'})}
  if(t<=BAG&&!bagD){bagD=true;npcs.forEach(n=>{if(n.seated&&(n.role==='leaver'||(n.role==='faker'&&Math.random()<.35)))n.cue='🎒'})}
  if(t<=0){phase='door';dp=0;setMsg(`🚪 ${nxt}역에 도착했습니다. 문이 열립니다!`);npcs.forEach(n=>{if(n.seated&&n.role==='leaver')n.lv=clock+.3+Math.random()*1.4})}}
 else if(phase==='door'){dp+=dt;
  npcs.filter(n=>n.lv&&clock>=n.lv).forEach(n=>{n.lv=0;leave(n)});
  npcs.filter(n=>n.tk&&clock>=n.tk).forEach(n=>{if(!at(n.tg.x,n.tg.y)){n.x=n.tg.x;n.y=n.tg.y;n.seated=true;n.dir=n.x<2?1:-1;n.role='stayer';n.cue=''}n.tk=0});
  if(dp>=DOOR&&!me.sit)fail()}
 else if(phase==='pause'){pt-=dt;npcs.filter(n=>n.lv&&clock>=n.lv).forEach(n=>{n.lv=0;leave(n)});
  if(pt<=0){if(stress>=100)return over();rd++;startRound(after==='no')}}}
function hud(){const L=LINES[line];$('badge').textContent=L.n;$('badge').style.background=L.c;$('tinfo').textContent=TIMES[time][0];
 $('sc').textContent=`${score}점 · 콤보 ${combo}`;$('fill').style.width=stress+'%';$('fill').style.background=`hsl(${120-stress*1.2},70%,45%)`;$('pct').textContent=`스트레스 ${Math.round(stress)}%`;
 const cf=me.cf||1;$('cmf').textContent=(phase==='run'||phase==='door')&&!me.sit?(me.y===4?'🚪 ':'')+(cf<.9?'😌 여유':cf>1.3?'😣 비좁음':'😐 보통')+' ×'+cf.toFixed(1):'';$('nx').textContent=`다음 역: ${L.st[(rd+1)%8]}`;$('tm').textContent=phase==='run'?`${Math.max(0,Math.ceil(t))}초`:phase==='door'?'🚪 문 열림':''}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function person(p,a,isMe){const x=gx(p.px),y=gy(p.py);ctx.save();ctx.globalAlpha=a==null?1:Math.max(0,a);
 ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(x+2,y+3,9,16,0,0,7);ctx.fill();
 ctx.fillStyle=isMe?'#e5483c':p.col;ctx.beginPath();ctx.ellipse(x,y,8.5,15,0,0,7);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=1;ctx.stroke();
 const hx=x+p.dir*3;ctx.fillStyle=p.skin;ctx.beginPath();ctx.arc(hx,y,7,0,7);ctx.fill();
 ctx.fillStyle=isMe?'#222':p.hair;ctx.beginPath();ctx.arc(hx,y,7.4,p.dir>0?Math.PI/2:-Math.PI/2,p.dir>0?Math.PI*1.5:Math.PI/2);ctx.closePath();ctx.fill();
 ctx.restore()}
function bubble(x,y,s,c){ctx.fillStyle=c||'#fff';ctx.beginPath();ctx.arc(x,y,10,0,7);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#000';ctx.font='12px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s,x,y+1)}
function draw(){const k=performance.now()/1000,lc=LINES[line].c;ctx.clearRect(0,0,W,H);ctx.fillStyle='#262a31';ctx.fillRect(0,0,W,H);
 let g=ctx.createLinearGradient(OX,0,OX+C*S,0);g.addColorStop(0,'#a9adb4');g.addColorStop(.5,'#d9dbe0');g.addColorStop(1,'#a9adb4');ctx.fillStyle=g;ctx.fillRect(OX,OY,C*S,R*S);
 ctx.strokeStyle='rgba(0,0,0,.06)';ctx.lineWidth=1;for(let i=1;i<R;i++){ctx.beginPath();ctx.moveTo(OX,OY+i*S);ctx.lineTo(OX+C*S,OY+i*S);ctx.stroke()}
 ctx.fillStyle='rgba(240,190,0,.55)';ctx.fillRect(OX+S,OY+4*S,3*S,3);ctx.fillRect(OX+S,OY+5*S-3,3*S,3);
 for(const side of[0,1]){const wx=side?OX+C*S:0;ctx.fillStyle='#3a4049';ctx.fillRect(wx,OY,OX,R*S);
  const wg=ctx.createLinearGradient(0,OY,0,OY+R*S);wg.addColorStop(0,'#a7c9df');wg.addColorStop(1,'#587c96');ctx.fillStyle=wg;
  for(const[a,b]of[[0,4],[5,9]]){rr(wx+10,OY+a*S+5,OX-20,(b-a)*S-10,5);ctx.fill()}
  const dy=OY+4*S,o=door*(S/2-3);ctx.fillStyle='#e9e3c9';ctx.fillRect(wx+6,dy+3,OX-12,S-6);ctx.fillStyle='#8f98a3';
  ctx.fillRect(wx+6,dy+3,OX-12,S/2-3-o);ctx.fillRect(wx+6,dy+S/2+o,OX-12,S/2-3-o)}
 for(const x of[0,C-1])for(let y=0;y<R;y++){if(y===4)continue;const cx=OX+x*S,cy=OY+y*S;
  ctx.fillStyle=lc;rr(cx+4,cy+4,S-8,S-8,9);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,.25)';rr(x?cx+S-11:cx+2,cy+4,9,S-8,4);ctx.fill();
  if(!at(x,y)){ctx.fillStyle=`rgba(70,235,120,${.5+.25*Math.sin(k*6)})`;rr(cx+4,cy+4,S-8,S-8,9);ctx.fill()}}
 ctx.lineCap='round';for(const[w,c]of[[5,'rgba(0,0,0,.25)'],[2.5,'#eef1f4']]){ctx.strokeStyle=c;ctx.lineWidth=w;
  for(const x of[OX+S,OX+4*S])for(const[a,b]of[[0,4],[5,9]]){ctx.beginPath();ctx.moveTo(x,OY+a*S+3);ctx.lineTo(x,OY+b*S-3);ctx.stroke()}}
 for(const x of[OX+S,OX+4*S])for(const y of[OY+4*S,OY+5*S]){ctx.fillStyle='#c9ced4';ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill();ctx.strokeStyle='#666';ctx.lineWidth=1;ctx.stroke()}
 const all=npcs.concat(ghosts).sort((a,b)=>a.py-b.py);all.forEach(n=>person(n,n.a));
 person(me,1,true);ctx.strokeStyle='#2f6fed';ctx.lineWidth=3;ctx.beginPath();ctx.arc(gx(me.px),gy(me.py),18+Math.sin(k*6),0,7);ctx.stroke();
 bubble(gx(me.px),gy(me.py)-26,'나','#9ec1ff');
 npcs.forEach(n=>{if(n.cue)bubble(gx(n.px)+(n.x<2?14:-14),gy(n.py)-18,n.cue)})}
function loop(ts){const dt=Math.min(.1,(ts-last)/1000);last=ts;update(dt);hud();draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(m){e.preventDefault();move(...m)}});
let sx=0,sy=0,dn=false;
addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;sx=e.clientX;sy=e.clientY;dn=true});
function sw(e){if(!dn)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)<28)return;dn=false;Math.abs(dx)>Math.abs(dy)?move(dx>0?1:-1,0):move(0,dy>0?1:-1)}addEventListener('pointermove',sw);addEventListener('pointerup',e=>{sw(e);dn=false});addEventListener('pointercancel',()=>{dn=false});
startRound();phase='idle';showSelect();requestAnimationFrame(loop);
</script>
</body>
</html>
