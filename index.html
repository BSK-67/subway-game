<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>지하철 눈치 생존</title>
<style>
:root{--bg:#eef0f3;--fg:#1c1e21;--bar:#c9ced4;--panel:rgba(255,255,255,.96);--me:#2f6fed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--fg:#eceff3;--bar:#3a3f46;--panel:rgba(26,29,34,.96)}}
:root[data-theme="dark"]{--bg:#15171a;--fg:#eceff3;--bar:#3a3f46;--panel:rgba(26,29,34,.96)}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{height:100dvh;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#hud{width:min(94vw,440px);padding:8px 0 4px}
#top{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;margin-bottom:6px;gap:6px}
#badge{color:#fff;padding:2px 10px;border-radius:12px}
#mu{font-size:16px;padding:0 6px;border:0;background:transparent}
#bar{position:relative;height:20px;background:var(--bar);border-radius:10px;overflow:hidden}
#fill{height:100%;width:0}
#pct{position:absolute;inset:0;text-align:center;font-size:12px;line-height:20px;font-weight:700;color:#000;mix-blend-mode:difference;filter:invert(1)}
#info{display:flex;justify-content:space-between;margin-top:5px;font-size:13px;font-weight:700}
#msg{margin-top:5px;min-height:34px;padding:6px 8px;border-radius:8px;background:var(--bar);font-size:13px;font-weight:600;text-align:center;box-sizing:border-box}
#wrap{position:relative;flex:1;min-height:0;width:min(94vw,440px);display:flex;justify-content:center;align-items:center;padding:6px 0 8px;box-sizing:border-box}
canvas{display:block;border-radius:12px;background:#262a31}
#toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);padding:12px 18px;border-radius:14px;font-size:20px;font-weight:800;color:#fff;opacity:0;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;animation:up 1.3s ease-out}
#toast.ok{background:#1fa14a}#toast.no{background:#d4432f}#toast.vi{background:#7b2cbf}
@keyframes up{from{transform:translate(-50%,-30%)}to{transform:translate(-50%,-70%)}}
#ov{position:absolute;inset:6px 0 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel);border-radius:12px;text-align:center;padding:14px;overflow:auto}
#ov h2{font-size:22px;margin:0 0 8px}
#ov p{margin:6px 0;line-height:1.5;font-size:13px}
.lb{font-size:12px;font-weight:700;margin:8px 0 4px;opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font:inherit;font-size:14px;font-weight:700;padding:7px 12px;border-radius:18px;border:2px solid var(--bar);background:transparent;color:var(--fg)}
.chip.on{background:var(--me);border-color:var(--me);color:#fff}
#go{font:inherit;font-weight:800;padding:12px 34px;border:0;border-radius:12px;background:var(--me);color:#fff;font-size:18px;margin-top:12px}
</style>
</head>
<body>
<div id="hud"><div id="top"><span id="badge"></span><span id="tinfo"></span><span id="sc"></span><button id="mu">🔊</button></div>
<div id="bar"><div id="fill"></div><span id="pct"></span></div>
<div id="info"><span id="nx"></span><span id="cmf"></span><span id="tm"></span></div><div id="msg"></div></div>
<div id="wrap"><canvas id="cv"></canvas><div id="toast"></div><div id="ov"></div></div>
<script>
const W=360,H=500,S=52,OX=50,OY=16,C=5,R=9,CYC=16,ANN=8,BAG=3,DOOR=4.2;
const LINES={2:{n:'2호선',c:'#00A84D',b:.9,st:['사당','방배','서초','교대','강남','역삼','선릉','삼성']},
9:{n:'9호선',c:'#B8A46A',b:1,st:['당산','여의도','샛강','노량진','동작','구반포','신반포','고속터미널']},
7:{n:'7호선',c:'#747F00',b:.78,st:['고속터미널','내방','이수','남성','숭실대입구','상도','장승배기','신대방삼거리']},
4:{n:'4호선',c:'#00A5DE',b:.68,st:['사당','이수','동작','이촌','신용산','삼각지','숙대입구','서울역']},
1:{n:'1호선',c:'#0052A4',b:.6,st:['서울역','시청','종각','종로3가','종로5가','동대문','동묘앞','신설동']}};
const TIMES={a:['06:00 새벽',.4],b:['08:00 출근',1],c:['14:00 낮',.45],d:['18:00 퇴근',.9],e:['23:00 심야',.35]};
const COLS=['#3b4a6b','#6b4a3b','#2f5d50','#7a6a3a','#5a3b6b','#555','#8a5a6a','#3d6a7a','#6a5a4a','#3a3a3a'],HAIR=['#1a1a1a','#3b2a1a','#5a3a20','#aaa','#222'],SKIN=['#f1c9a5','#e0ac82','#c68c62','#f5d6b8'],BAGC=['#8d6e63','#455a64','#7b1fa2','#00796b','#c0a060'];
const CH={s:{n:'🎒 학생',d:'백팩을 멘 학생: 앉기 속도 보너스 +50%',col:'#2a4d8f'},w:{n:'💼 직장인',d:'정장 직장인: 스트레스 증가 -15%',col:'#3b3f48'},u:{n:'🎧 대학생',d:'헤드폰 대학생: 붐비는 자리·문 앞 영향 절반',col:'#ff8a3d'}};
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),dpr=Math.min(2,devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
const $=id=>document.getElementById(id),ov=$('ov'),tEl=$('toast');
let line=2,time='b',diff=1,npcs=[],ghosts=[],preg=[[0,3]],vilSeat=null,ch='s',me={x:2,y:4,px:2,py:4,sit:false,dir:1,skin:'#f1c9a5',hair:'#222'},stress=0,score=0,combo=0,okN=0,rd=0,phase='idle',t=0,dp=0,pt=0,clock=0,annD=false,bagD=false,door=0,after='',state='idle',last=performance.now(),tt,best=0,K=0,muted=false,AC=null;
try{best=+localStorage.getItem('subwayBest')||0}catch(e){}
const rnd=a=>a[Math.random()*a.length|0],isSeat=(x,y)=>(x===0||x===C-1)&&y!==4,isPreg=(x,y)=>preg.some(p=>p[0]===x&&p[1]===y);
const gx=x=>OX+x*S+S/2,gy=y=>OY+y*S+S/2,calc=()=>Math.min(1,LINES[line].b*TIMES[time][1]+.1);
const at=(x,y)=>me.x===x&&me.y===y?me:npcs.find(n=>n.x===x&&n.y===y);
function mk(x,y,seated){return{x,y,px:x,py:y,seated,col:rnd(COLS),hair:rnd(HAIR),skin:rnd(SKIN),bagc:rnd(BAGC),bag:seated&&Math.random()<.65,seed:Math.random()*6.28,dir:seated?(x<2?1:-1):(Math.random()<.5?1:-1),role:'stayer',act:''}}
function setMsg(s){$('msg').textContent=s}
function toast(s,c){tEl.textContent=s;tEl.className='show '+c;clearTimeout(tt);tt=setTimeout(()=>tEl.className='',1300)}
function say(s){if(muted)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='ko-KR';u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
function tone(f,s,d){if(muted||!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);const T=AC.currentTime+s;g.gain.setValueAtTime(.15,T);g.gain.exponentialRampToValueAtTime(.001,T+d);o.start(T);o.stop(T+d)}catch(e){}}
const chime=()=>{tone(784,0,.3);tone(659,.3,.3);tone(523,.6,.5)},beep=()=>{tone(1200,0,.12);tone(1200,.18,.12)};
function startRound(keep){diff=calc();ghosts=[];vilSeat=null;
 if(!keep){npcs=[];Object.assign(me,{x:2,y:4,px:2,py:4,sit:false});me.dir=1}
 for(let y=0;y<R;y++)for(const x of[0,C-1])if(y!==4&&!at(x,y))npcs.push(mk(x,y,true));
 npcs.forEach(n=>{n.act='';n.lv=0;n.tk=0;n.pe=0;n.role='stayer'});
 const s=npcs.filter(n=>n.seated).sort(()=>Math.random()-.5),lv=Math.max(2,Math.min(4,Math.round(4-diff*2))),fk=Math.round(2+diff*3);
 s.forEach((n,i)=>n.role=i<lv?'leaver':i<lv+fk?'faker':'stayer');
 let k=Math.round(2+5*diff)-npcs.filter(n=>!n.seated).length,g=0;while(k>0&&g++<200){const x=1+Math.random()*3|0,y=Math.random()*R|0;if(!at(x,y)){npcs.push(mk(x,y,false));k--}}
 if(!npcs.some(n=>n.v&&!n.seated)&&Math.random()<.3+.5*diff){const q=npcs.filter(n=>!n.seated);if(q.length)rnd(q).v=true}
 phase='run';t=CYC;dp=0;annD=bagD=false;after='';
 setMsg(keep?'문이 닫힙니다. 같은 칸에서 계속 자리를 노리세요!':`${LINES[line].st[rd%8]}역 출발! 내릴 사람을 찾아 앞에 서세요.`)}
function showSelect(head){ov.style.display='flex';
 ov.innerHTML=(head||'<h2>🚇 지하철 눈치 생존</h2><p>두리번거리다 짐을 챙기는 승객이 내릴 사람입니다. 안내방송을 듣고 앞에서 기다렸다가 문이 열리면 재빨리 앉으세요. 🤰 문 옆 분홍색 임산부석은 금지, 😈 뒤로 가방맨 빌런의 자리를 가로채면 점수 2배!</p>')+
 '<div class="lb">캐릭터</div><div class="chips" id="cc"></div><p id="cd" style="margin:2px 0"></p><div class="lb">노선</div><div class="chips" id="cl"></div><div class="lb">시간대</div><div class="chips" id="ct"></div><p id="ds"></p><button id="go">출발</button>';
 const upd=()=>{diff=calc();const s=Math.round(diff*4);$('ds').innerHTML=`난이도 ${'★'.repeat(1+s)}${'☆'.repeat(4-s)} · 최고 ${best}점<br><small>혼잡도는 게임용 설정값입니다</small>`;
  document.querySelectorAll('#cl .chip').forEach(c=>c.classList.toggle('on',c.dataset.k==line));document.querySelectorAll('#ct .chip').forEach(c=>c.classList.toggle('on',c.dataset.k==time));document.querySelectorAll('#cc .chip').forEach(c=>c.classList.toggle('on',c.dataset.k==ch));$('cd').textContent=CH[ch].d};
 for(const k in LINES){const b=document.createElement('button');b.className='chip';b.dataset.k=k;b.textContent=LINES[k].n;b.onclick=()=>{line=k;upd();startRound();phase='idle'};$('cl').appendChild(b)}
 for(const k in TIMES){const b=document.createElement('button');b.className='chip';b.dataset.k=k;b.textContent=TIMES[k][0];b.onclick=()=>{time=k;upd();startRound();phase='idle'};$('ct').appendChild(b)}
 for(const k in CH){const b=document.createElement('button');b.className='chip';b.dataset.k=k;b.textContent=CH[k].n;b.onclick=()=>{ch=k;upd()};$('cc').appendChild(b)}
 upd();$('go').onclick=begin}
function begin(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume();const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}
 score=0;combo=0;okN=0;stress=0;rd=0;state='play';ov.style.display='none';startRound();last=performance.now()}
function over(){state='end';phase='idle';if(score>best){best=score;try{localStorage.setItem('subwayBest',best)}catch(e){}}
 showSelect(`<h2>게임 오버 😵</h2><p>스트레스가 가득 찼습니다!<br>점수 <b>${score}</b> · 앉기 성공 ${okN}회</p>`)}
function success(){navigator.vibrate&&navigator.vibrate(60);phase='pause';pt=1.4;after='ok';
 if(isPreg(me.x,me.y)){const pen=Math.round(150*(1+diff));score-=pen;combo=0;stress=Math.max(0,stress-10);toast(`🤰 임산부석! −${pen}`,'no');setMsg('양보가 필요한 좌석입니다. 점수가 깎였어요.');return}
 combo++;okN++;const sp=Math.max(0,Math.round((3.2-dp)*45*(ch==='s'?1.5:1))),st=vilSeat&&vilSeat.x===me.x&&vilSeat.y===me.y&&vilSeat.n.tk&&!vilSeat.n.seated;
 let pts=Math.round((100+sp+combo*20)*(1+diff));if(st)pts*=2;score+=pts;stress=Math.max(0,stress-50);
 toast(st?`😈 빌런 자리 강탈! ×2 +${pts}`:`💺 앉기 성공! +${pts}`,st?'vi':'ok');setMsg(`속도 보너스 +${sp} · 콤보 ${combo}연속`)}
function fail(){phase='pause';pt=1.2;after='no';combo=0;stress=Math.min(100,stress+8);toast('😩 못 앉았다… 스트레스 +8','no');setMsg('다음 역에서 다시 도전하세요.')}
function move(dx,dy){if(state!=='play'||(phase!=='run'&&phase!=='door'))return;const nx=me.x+dx,ny=me.y+dy;
 if(nx<0||ny<0||nx>=C||ny>=R)return;const o=at(nx,ny);if(o){if(o.seated||me.sit)return;o.x=me.x;o.y=me.y}if(dx)me.dir=dx>0?1:-1;me.x=nx;me.y=ny;me.sit=isSeat(nx,ny);if(me.sit&&phase==='door')success()}
function leave(n){npcs.splice(npcs.indexOf(n),1);ghosts.push(Object.assign({},n,{tx:n.x<2?-.8:C-.2,ty:4,a:1,act:'pack'}));
 const seat={x:n.x,y:n.y};let b=null,bt=99;
 npcs.forEach(s=>{if(s.seated||s.tk)return;const d=Math.abs(s.x-seat.x)+Math.abs(s.y-seat.y);if(d<=(s.v?7:5)){const rt=(.35+d*.4+Math.random()*.5)*(1.3-.55*diff)*(s.v?.6:1);if(rt<bt){bt=rt;b=s}}});
 if(b){b.tk=clock+bt;b.tg=seat;if(b.v)vilSeat={x:seat.x,y:seat.y,n:b}}}
function comfort(){let n=0;for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){if((dx||dy)&&at(me.x+dx,me.y+dy))n++}let f=.7+.12*n;if(me.y===4)f*=(me.x===2?1.2:1.5);
 if(npcs.some(o=>o.v&&!o.seated&&Math.abs(o.x-me.x)<=1&&Math.abs(o.y-me.y)<=1))f*=1.3;return f}
function update(dt){clock+=dt;
 npcs.forEach(n=>{n.px+=(n.x-n.px)*Math.min(1,dt*9);n.py+=(n.y-n.py)*Math.min(1,dt*9)});
 me.px+=(me.x-me.px)*Math.min(1,dt*14);me.py+=(me.y-me.py)*Math.min(1,dt*14);
 ghosts.forEach(g=>{g.px+=(g.tx-g.px)*Math.min(1,dt*2.2);g.py+=(g.ty-g.py)*Math.min(1,dt*2.2);g.a-=dt*.7});ghosts=ghosts.filter(g=>g.a>0);
 door+=((phase==='door'||after==='ok'?1:0)-door)*Math.min(1,dt*6);
 if(state!=='play')return;
 if(phase==='run'||phase==='door'){if(!me.sit){me.cf=comfort();if(ch==='u')me.cf=1+(me.cf-1)*.5;stress=Math.min(100,stress+(.8+diff)*(.5+.015*stress)*me.cf*(ch==='w'?.85:1)*dt)}
  const v=npcs.find(n=>n.v&&!n.seated);if(v&&!v.tk&&clock>=(v.mv||0)){const d=rnd([[1,0],[-1,0],[0,1],[0,-1]]),nx=v.x+d[0],ny=v.y+d[1];if(nx>=1&&nx<=3&&ny>=0&&ny<R&&!at(nx,ny)){v.x=nx;v.y=ny}v.mv=clock+1.1+Math.random()*1.6}}
 if(stress>=100&&phase!=='pause')return over();
 const nxt=LINES[line].st[(rd+1)%8];
 if(phase==='run'){t-=dt;npcs.forEach(n=>{if(n.pe&&clock>=n.pe){n.act='look';n.pe=0}});
  if(t<=ANN&&!annD){annD=true;chime();say(`이번 역은 ${nxt}, ${nxt}역입니다.`);setMsg(`📢 이번 역은 ${nxt}, ${nxt}역입니다.`+(npcs.some(n=>n.v&&!n.seated)?' 😈 가방맨 주의!':''));npcs.forEach(n=>{if(n.seated&&n.role!=='stayer')n.act='look'})}
  if(t<=BAG&&!bagD){bagD=true;npcs.forEach(n=>{if(n.seated&&n.role==='leaver')n.act='pack';else if(n.seated&&n.role==='faker'&&Math.random()<.35){n.act='pack';n.pe=clock+1.6}})}
  if(t<=0){phase='door';dp=0;beep();say(`${nxt}역입니다. 문이 열립니다.`);setMsg(`🚪 ${nxt}역에 도착했습니다. 문이 열립니다!`);npcs.forEach(n=>{if(n.seated&&n.role==='leaver')n.lv=clock+.3+Math.random()*1.4})}}
 else if(phase==='door'){dp+=dt;
  npcs.filter(n=>n.lv&&clock>=n.lv).forEach(n=>{n.lv=0;leave(n)});
  npcs.filter(n=>n.tk&&clock>=n.tk).forEach(n=>{if(!at(n.tg.x,n.tg.y)){n.x=n.tg.x;n.y=n.tg.y;n.seated=true;n.v=false;n.dir=n.x<2?1:-1;n.role='stayer';n.act=''}n.tk=0});
  if(dp>=DOOR&&!me.sit)fail()}
 else if(phase==='pause'){pt-=dt;npcs.filter(n=>n.lv&&clock>=n.lv).forEach(n=>{n.lv=0;leave(n)});
  if(pt<=0){if(stress>=100)return over();rd++;startRound(after==='no')}}}
function hud(){const L=LINES[line],cf=me.cf||1;$('badge').textContent=L.n;$('badge').style.background=L.c;$('tinfo').textContent=TIMES[time][0];
 $('sc').textContent=`${score}점 · 콤보 ${combo}`;$('fill').style.width=stress+'%';$('fill').style.background=`hsl(${120-stress*1.2},70%,45%)`;$('pct').textContent=`스트레스 ${Math.round(stress)}%`;
 $('cmf').textContent=(phase==='run'||phase==='door')&&!me.sit?(me.y===4?'🚪 ':'')+(cf<.9?'😌 여유':cf>1.3?'😣 비좁음':'😐 보통')+' ×'+cf.toFixed(1):'';
 $('nx').textContent=`다음 역: ${L.st[(rd+1)%8]}`;$('tm').textContent=phase==='run'?`${Math.max(0,Math.ceil(t))}초`:phase==='door'?'🚪 문 열림':''}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function personOld(p,a,isMe){const sway=p.seated||isMe||p.a!=null?0:Math.sin(K*2.2+p.seed)*(phase==='run'&&t<BAG?2.2:1),x=gx(p.px)+sway,y=gy(p.py),d=p.dir||1;
 const look=p.act==='look'||(p.v&&!p.seated),pack=p.act==='pack',lean=pack?.5+.5*Math.sin(K*8+p.seed):0,bx=d*lean*4;
 let ang=d>0?0:Math.PI;if(look)ang+=Math.sin(K*4+p.seed)*1.2;
 ctx.save();ctx.globalAlpha=a==null?1:Math.max(0,a);
 ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(x+2,y+3,9,16,0,0,7);ctx.fill();
 if(p.v&&!p.seated){ctx.fillStyle='#17181c';rr(x-d*14-6,y-11,12,22,4);ctx.fill();ctx.fillStyle='#d62828';ctx.fillRect(x-d*14-6,y-2,12,3);ctx.fillStyle='#555';ctx.fillRect(x-d*8,y-8,3,3);ctx.fillRect(x-d*8,y+5,3,3)}
 ctx.fillStyle=isMe?'#ff8a3d':p.col;ctx.beginPath();ctx.ellipse(x+bx,y,8.5,15,0,0,7);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=1;ctx.stroke();
